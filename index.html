.yc-phone{width:min(392px,100%);border:1px solid #ccc;border-radius:16px;overflow:hidden;background:#F5F2EA;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.12)}

.yc-status{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;font-size:12px}
.yc-status .yc-net{display:flex;align-items:center;gap:4px;color:#167D73}
.yc-hd{padding:4px 16px 12px}
.yc-title{font-size:22px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:8px}
.yc-sunline{width:44px;height:3px;background:#E6A84A;border-radius:2px;margin-top:6px}
.yc-lang{display:flex;background:rgba(29,43,42,.06);border-radius:8px;padding:2px;margin-top:8px;width:max-content}
.yc-lang button{border:0;background:transparent;padding:4px 12px;border-radius:6px;font-size:13px;cursor:pointer;color:inherit}
.yc-lang button.on{background:#1D2B2A;color:#F5F2EA}
.yc-card{background:#fff;border:1px solid rgba(29,43,42,.08);border-radius:12px;padding:12px;margin:0 12px 12px}
.yc-row{display:flex;align-items:center;gap:8px}
.yc-grow{flex:1;min-width:0}
.yc-muted{font-size:12px;color:rgba(29,43,42,.55)}
.yc-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.yc-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;background:#E6A84A;color:#1D2B2A}
.yc-btn.ghost{background:transparent;border:1px solid rgba(29,43,42,.2);color:inherit}
.yc-btn.dark{background:#1D2B2A;color:#F5F2EA}
.yc-btn:disabled{opacity:.4}
.yc-iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(29,43,42,.15);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:inherit}
.yc-iconbtn.saff{background:#E6A84A;border-color:#E6A84A;color:#1D2B2A}

.yc-prog>i{display:block;height:100%;background:#167D73;border-radius:4px;transition:width .4s ease-out}
.yc-loop{display:flex;align-items:stretch}
.yc-step{flex:1;text-align:center}

.yc-lab{font-size:11px;line-height:1.3}
.yc-conn{width:22px;align-self:flex-start;margin-top:16px;color:rgba(29,43,42,.3);flex:none}
.yc-rep{display:flex;gap:10px;align-items:flex-start}
.yc-catic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}

.yc-fchip{border:1px solid rgba(29,43,42,.15);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:inherit}
.yc-fchip.on{background:#1D2B2A;color:#F5F2EA;border-color:#1D2B2A}

.yc-steps{display:flex;gap:6px;padding:0 12px 12px}

.yc-pip.on{background:#E6A84A}

.yc-cattile{background:#fff;border:1.5px solid rgba(29,43,42,.1);border-radius:12px;padding:14px 4px 10px;text-align:center;cursor:pointer}

.yc-cl{font-size:12px;font-weight:600}

function t(k){return T[S.lang][k];}
function tt(r){return S.lang==='dari'?r.t_d:r.t_p;}
function ago(r){return r.age+' '+t(r.u);}
function stChip(st){var s=ST[st];return '<span class="yc-chip" style="color:'+s[1]+';background:'+s[2]+'">'+t(s[0])+'</span>';}
function catIcon(c,s){var k=CAT[c];return '<span class="yc-catic" style="background:'+k.bg+';color:'+k.col+'">'+ic(k.icon,s||22)+'</span>';}
function ring(pct,col){var r=8,c=2*Math.PI*r;
 return '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="'+r+'" fill="none" stroke="rgba(29,43,42,.1)" stroke-width="3"/><circle cx="13" cy="13" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-pct)).toFixed(1)+'" transform="rotate(-90 13 13)"/></svg>';}

function pinsSVG(){
 return S.reports.filter(function(r){return S.filter==='all'||r.cat===S.filter;}).map(function(r){
  var k=CAT[r.cat],sel=S.sel===r.id;
  var g='<g transform="translate('+r.x+','+r.y+')" style="cursor:pointer" onclick="event.stopPropagation();openPin('+r.id+')">';
  if(sel)g+='<circle r="16" fill="'+k.col+'" opacity=".18"/>';
  g+='<circle r="11" fill="'+k.col+'" stroke="#fff" stroke-width="2"/>';
  g+='<g transform="translate(-7,-7) scale(0.583)" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">'+I[k.icon]+'</g>';
  if(r.status==='resolved')g+='<circle cx="8" cy="-8" r="6.5" fill="#167D73" stroke="#fff" stroke-width="1.6"/><path d="M5.2 -8.4l1.8 1.8 3-3.2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  return g+'</g>';}).join('');}
function mapSVG(h,mode){
 var blocks=[[10,14,60,60],[90,14,150,60],[262,14,88,80],[10,96,58,52],[90,116,150,40,'p'],[262,116,88,26],[10,168,58,56],[90,168,150,56],[262,182,88,90,'p'],[10,242,58,90],[90,242,150,90],[262,282,88,50],[10,352,58,58],[90,352,150,58],[262,352,88,58]];
 var b=blocks.map(function(x){return '<rect x="'+x[0]+'" y="'+x[1]+'" width="'+x[2]+'" height="'+x[3]+'" rx="6" fill="'+(x[4]==='p'?'rgba(22,125,115,.12)':'rgba(255,255,255,.65)')+'" stroke="rgba(29,43,42,.07)"/>';}).join('');
 b+='<circle cx="120" cy="136" r="7" fill="rgba(22,125,115,.35)"/><circle cx="300" cy="220" r="9" fill="rgba(22,125,115,.3)"/><circle cx="310" cy="130" r="6" fill="rgba(22,125,115,.35)"/>';
 var st=STREETS.map(function(s){return '<polyline points="'+s.pts.map(function(p){return p.join(',');}).join(' ')+'" fill="none" stroke="'+(s.canal?'rgba(22,125,115,.5)':'#DAD2BF')+'" stroke-width="'+(s.canal?7:11)+'" stroke-linecap="round"/>';}).join('');
 st+=STREETS.map(function(s){var p=s.pts[0];return '<text x="'+(p[0]+6)+'" y="'+(p[1]-6)+'" font-size="9" fill="rgba(29,43,42,.45)">'+s.n+'</text>';}).join('');
 var extra='';
 if(mode==='full')extra+=pinsSVG();
 if(S.newPin&&mode==='full')extra+='<g transform="translate('+S.newPin.x+','+S.newPin.y+')"><circle r="15" fill="none" stroke="#E6A84A" stroke-width="2" class="yc-pulse"/><path d="M0 6.5 C -7 -1.5 -5 -11.5 0 -11.5 C 5 -11.5 7 -1.5 0 6.5z" fill="#E6A84A" stroke="#1D2B2A" stroke-width="1.4"/><circle cy="-5.5" r="2.3" fill="#1D2B2A"/></g>';
 if(mode==='pick'&&S.rep.loc)extra+='<g transform="translate('+S.rep.loc.x+','+S.rep.loc.y+')"><circle r="14" fill="none" stroke="#E6A84A" stroke-width="2"/><path d="M0 6.5 C -7 -1.5 -5 -11.5 0 -11.5 C 5 -11.5 7 -1.5 0 6.5z" fill="#E6A84A" stroke="#1D2B2A" stroke-width="1.4"/><circle cy="-5.5" r="2.3" fill="#1D2B2A"/></g>';
 return '<svg viewBox="0 0 360 420" style="height:'+h+'px" onclick="mapTap(event,'+(mode==='pick'?1:0)+')">'+b+st+extra+'</svg>';}
function mapTap(e,pick){
 var svg=e.currentTarget;var r=svg.getBoundingClientRect();
 var x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*420/r.height;
 if(pick){S.rep.loc={x:x,y:y,addr:geo(x,y)};}
 else{S.newPin={x:x,y:y,addr:geo(x,y)};S.sel=null;}
 render();}
function openPin(id){S.sel=(S.sel===id)?null:id;S.newPin=null;render();}
function startReportHere(){S.rep={step:2,cat:null,loc:S.newPin,photo:false,voice:0,done:false};S.newPin=null;S.tab='report';render();}

function statusBar(sub){return '<div class="yc-status"><span>۱۴:۳۷</span><span class="yc-net">'+ic('off',13)+' '+(sub||t('offlineOn'))+'</span></div>';}
function langPills(){return '<div class="yc-lang"><button class="'+(S.lang==='dari'?'on':'')+'" onclick="setLang(\'dari\')">دری</button><button class="'+(S.lang==='pshto'?'on':'')+'" onclick="setLang(\'pshto\')">پښتو</button></div>';}
function reportRow(r,actions){
 var did=S.confirmed[r.id];
 var dots='';for(var i=0;i<4;i++)dots+='<i class="'+(r.conf>=(i+1)*3?'t':'')+'"></i>';
 return '<div class="yc-card"><div class="yc-rep">'+catIcon(r.cat)
 +'<div class="yc-grow"><div class="yc-row"><b style="font-size:14px" class="yc-grow">'+tt(r)+'</b>'+stChip(r.status)+'</div>'
 +'<div class="yc-stamp">'+ic('pin',12)+' '+geo(r.x,r.y).split('·')[0]+' · '+ago(r)+'</div>'
 +'<div class="yc-row" style="margin-top:8px"><div class="yc-dots">'+dots+'</div><span class="yc-muted">'+r.conf+' '+t('neighbors')+'</span><span class="yc-grow"></span>'
 +((actions!==false&&r.status!=='resolved')?('<button class="yc-confirm '+(did?'did':'')+'" onclick="confirmRep('+r.id+')">'+ic(did?'check':'user',14)+(did?t('confirmed'):t('confirm'))+'</button>'):'')
 +'</div></div></div></div>';}
function toast(msg){var el=document.getElementById('yc-toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(function(){el.classList.remove('show');},2200);}

  ?'<span class="yc-chip yc-pulse" style="color:#B9811F;background:rgba(230,168,74,.16)">'+ic('sync',12)+' '+t('queue')+'</span>'

function tlRow(r){
 var orb,lab;
 if(r.status==='resolved'){orb='<div class="yc-torb ok">'+ic('check',16)+'</div>';lab=t('statDone');}
 else if(r.status==='progress'){orb='<div class="yc-torb warn">'+ic('sync',16)+'</div>';lab=t('statProg');}
 else if(r.status==='verified'){orb='<div class="yc-torb ok">'+ic('user',16)+'</div>';lab=t('statVer');}
 else{orb='<div class="yc-torb">'+ic('pin',16)+'</div>';lab=t('statNew');}
 return '<div style="padding:0 12px"><div class="yc-tl">'+orb+'<div class="yc-grow"><div class="yc-row"><b class="yc-grow" style="font-size:14px">'+tt(r)+'</b>'+stChip(r.status)+'</div><div class="yc-stamp">'+lab+' · '+ago(r)+'</div></div></div></div>';}

 +'<div class="yc-card"><div class="yc-row"><span class="yc-iconbtn" style="width:48px;height:48px;border-radius:12px;background:#1D2B2A;color:#F5F2EA;border:0">'+ic('user',24)+'</span><div class="yc-grow"><b style="font-size:15px">احمد رحیمی</b><div class="yc-stamp">'+ic('pin',12)+' '+t('nahia')+'</div></div></div>'
 +'<div class="yc-row" style="margin-top:12px;text-align:center"><div class="yc-grow"><b style="font-size:18px">'+S.mine.length+'</b><div class="yc-muted">'+t('reports')+'</div></div><div class="yc-grow"><b style="font-size:18px">'+confirms+'</b><div class="yc-muted">'+t('confirmed')+'</div></div><div class="yc-grow"><b style="font-size:18px">'+votes+'</b><div class="yc-muted">'+t('votes')+'</div></div></div></div>'
 +row(ic('bell',18),t('notif'),'<button class="yc-fchip '+(S.notif?'on':'')+'" onclick="S.notif=!S.notif;render()">'+(S.notif?t('done'):t('closeMap'))+'</button>')
 +row(ic('off',18),t('offline'),'<button class="yc-fchip '+(S.offline?'on':'')+'" onclick="S.offline=!S.offline;render()">'+(S.offline?t('done'):t('closeMap'))+'</button>')
 +row(ic('info',18),t('help'),'<button class="yc-iconbtn" onclick="S.help=true;render()">'+ic('back',16)+'</button>')
 +row(ic('chart',18),t('muni'),'<button class="yc-iconbtn" onclick="S.muni=true;render()">'+ic('back',16)+'</button>')
 +'<div class="yc-toast" id="yc-toast"></div>';}

function vMuni(){
 var total=S.reports.length;
 var ver=S.reports.filter(function(r){return r.status==='verified'||r.status==='progress';}).length;
 var res=S.reports.filter(function(r){return r.status==='resolved';}).length;
 function act(r){
  if(r.status==='resolved')return '<span class="yc-chip" style="color:#167D73;background:rgba(22,125,115,.13)">'+ic('check',12)+' '+t('resolved')+'</span>';
  var lbl=r.status==='progress'?t('solve'):t('accept');
  return '<button class="yc-confirm" onclick="muniAdvance('+r.id+')">'+ic(r.status==='progress'?'check':'sync',14)+' '+lbl+'</button>';}
 return statusBar(t('queue2'))
 +'<div class="yc-hd"><div class="yc-title"><button class="yc-navbtn" onclick="S.muni=false;render()">'+ic('back',18)+'</button>'+t('muniTitle')+'</div><div class="yc-sunline"></div></div>'
 +'<div class="yc-metrics"><div class="yc-metric"><b>'+total+'</b><span class="yc-muted">'+t('mTotal')+'</span></div><div class="yc-metric"><b style="color:#167D73">'+ver+'</b><span class="yc-muted">'+t('mVer')+'</span></div><div class="yc-metric"><b style="color:#167D73">'+res+'</b><span class="yc-muted">'+t('mRes')+'</span></div></div>'
 +'<div style="padding:0 16px 6px;font-size:13px;font-weight:600">'+t('queue2')+'</div>'
 +S.reports.map(function(r){return '<div class="yc-card" style="margin-bottom:8px"><div class="yc-rep">'+catIcon(r.cat)+'<div class="yc-grow"><div class="yc-row"><b class="yc-grow" style="font-size:14px">'+tt(r)+'</b><span class="yc-chip" style="color:#B9811F;background:rgba(230,168,74,.16)">'+ic('user',11)+' '+r.conf+'</span></div><div class="yc-stamp">'+ic('pin',12)+' '+geo(r.x,r.y).split('·')[0]+' · '+stChip(r.status)+'</div><div class="yc-row" style="margin-top:8px"><span class="yc-grow"></span>'+act(r)+'</div></div></div></div>';}).join('')
 +'<div class="yc-toast" id="yc-toast"></div>';}

function helpOverlay(){
 return '<div class="yc-sheet" style="border-color:rgba(230,168,74,.6);background:rgba(230,168,74,.07)"><div class="yc-row" style="margin-bottom:6px"><b class="yc-grow" style="font-size:14px">'+t('helpT')+'</b><button class="yc-iconbtn" style="width:28px;height:28px" onclick="S.help=false;render()">'+ic('close',14)+'</button></div><div style="font-size:13px;line-height:1.6">'+t('helpB')+'</div></div>';}

/* ---------- actions ---------- */
function setLang(l){S.lang=l;render();}
function setTab(tab){S.tab=tab;S.sel=null;S.newPin=null;if(tab!=='report'&&!S.rep.done){S.rep={step:1,cat:null,loc:null,photo:false,voice:0,done:false};}render();}
function confirmRep(id){if(S.confirmed[id])return;S.confirmed[id]=1;var r=S.reports.find(function(x){return x.id===id;});r.conf++;if(r.status==='new'&&r.conf>=3)r.status='verified';toast(t('confirmNote'));render();}
function vote(id){var r=S.reports.find(function(x){return x.id===id;});if(S.voted[id]){delete S.voted[id];r.conf=Math.max(0,r.conf-1);}else{S.voted[id]=1;r.conf++;toast(t('votedone'));}render();}
function pickCat(c){S.rep.cat=c;S.rep.step=2;render();}
function gpsLoc(){S.rep.loc={x:170,y:252,addr:geo(170,252)};render();}
function addPhoto(){S.rep.photo=true;render();}
function addVoice(){if(S.rep.voice)return;S.rep.voice=1;render();setTimeout(function(){S.rep.voice=2;render();toast(t('voicedone'));},1100);}
function wNext(){if(S.rep.step===2&&!S.rep.loc)return;S.rep.step=Math.min(3,S.rep.step+1);render();}
function wPrev(){S.rep.step=Math.max(1,S.rep.step-1);render();}
function submitReport(){
 var c=S.rep.cat,id=1000+S.mine.length;
 var dk=T.dari[CAT[c].dk],ps=T.pshto[CAT[c].dk];
 var entry={id:id,cat:c,t_d:dk,t_p:ps,x:S.rep.loc.x,y:S.rep.loc.y,conf:0,status:'new',age:1,u:'min'};
 S.reports.unshift(entry);
 S.mine.unshift({id:id,cat:c,t_d:dk,t_p:ps,addr:S.rep.loc.addr,phase:'queue'});
 S.rep.done=true;
 setTimeout(function(){var m=S.mine.find(function(x){return x.id===id;});if(m){m.phase='synced';toast(t('synced'));if(S.tab==='report'||S.tab==='act')render();}},2400);
 render();}
function resetRep(){S.rep={step:1,cat:null,loc:null,photo:false,voice:0,done:false};render();}
function muniAdvance(id){var r=S.reports.find(function(x){return x.id===id;});
 if(r.status==='progress')r.status='resolved';else r.status='progress';render();}

/* ---------- render ---------- */
function tabbar(){
 function tab(key,icon,label){return '<button class="yc-tab '+(S.tab===key&&!S.muni?'on':'')+'" onclick="setTab(\''+key+'\')"><span class="yc-tic">'+ic(icon,22)+'</span>'+label+'</button>';}
 return tab('home','home',t('home'))+tab('map','pin',t('map'))
 +'<button class="yc-fab" onclick="setTab(\'report\')">'+ic('plus',26)+'</button>'
 +tab('act','hist',t('act'))+tab('prof','user',t('prof'));}
function render(){
 var scr=document.getElementById('yc-screen');
 var h=S.muni?vMuni():({home:vHome,map:vMap,report:vReport,act:vActivity,prof:vProfile})[S.tab]();
 if(S.help)h+=helpOverlay();
 scr.innerHTML=h;scr.scrollTop=0;
 document.getElementById('yc-tabbar').innerHTML=tabbar();}
render();
</script>
</body>
</html>
